services:
  # The React application, served by nginx, which also proxies /api to the API
  # so the browser talks to a single origin.
  frontend:
    image: kestrel/frontend:stack
    restart: always
    depends_on:
      - api
    ports:
      - 80

  api:
    image: kestrel/api:stack
    restart: always
    depends_on:
      - db
    environment:
      - PORT=8080
      - DATABASE_HOST=db
      - DATABASE_NAME=rentals
      - DATABASE_USER=postgres
      - DATABASE_SSLMODE=disable
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=rentals@kestrelrental.example
      - MAIL_FROM_NAME=Kestrel Equipment Rental
      - TAX_RATE_PERCENT=8.5
      - LATE_FEE_MULTIPLE=1.5
      - LOG_FORMAT=json
      # Forwarded, not defaulted. An inline literal would shadow the deployment's
      # config.env on both targets (inline ranks above it by design), so these
      # are written as pass-throughs: the deployer's value reaches the container,
      # and the knobs stay visible here rather than being invisible omissions.
      #
      #   stack init ... --config PUBLIC_BASE_URL=https://host \
      #                  --config CORS_ORIGINS=https://host \
      #                  --config SEED_ON_BOOT=true
      #
      # Unset is fine: the API falls back to its own defaults.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SEED_ON_BOOT=${SEED_ON_BOOT}
    ports:
      - 8080

  # Sends the reminder emails and runs the daily overdue sweep. Separate from
  # the API so slow mail delivery can never hold up a web request.
  worker:
    image: kestrel/api:stack
    command: ["/usr/local/bin/worker"]
    restart: always
    depends_on:
      - db
      - api
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=rentals
      - DATABASE_USER=postgres
      - DATABASE_SSLMODE=disable
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=rentals@kestrelrental.example
      - MAIL_FROM_NAME=Kestrel Equipment Rental
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - LATE_FEE_MULTIPLE=1.5
      - WORKER_POLL_SECONDS=15
      - LOG_FORMAT=json

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=rentals
      - POSTGRES_USER=postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  # Catches every outbound email and shows it in a browser inbox. This is the
  # development and demonstration mail transport; a real deployment points
  # SMTP_HOST at a relay instead and drops this service.
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    # 1025 is SMTP, which the API and worker connect to; 8025 is the web inbox.
    # Both are declared because both are dialled — a Service only forwards the
    # ports it lists.
    ports:
      - 1025
      - 8025

volumes:
  db-data:
