name: Publish Container Images

# Builds this stack's container images and publishes them to GHCR, tagged with
# this repo's commit hash.  A later `stack prepare` on a deploy host computes the
# same hash, finds the image at ghcr.io/codeassociates/<name>:<hash> and pulls it
# instead of building — no configuration needed on the host, because stack infers
# ghcr.io from this repo's github.com remote.
#
# Only clean, committed state publishes: a dirty checkout or an unpinned input
# produces a `stackdev-` version, which stack never pushes.
#
# The runner is amd64, so only amd64 manifests are published.  An arm64 deploy
# target will not match and will fall back to building locally.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stack
        run: |
          mkdir -p "$HOME/bin"
          curl -L -o "$HOME/bin/stack" https://github.com/bozemanpass/stack/releases/latest/download/stack
          chmod +x "$HOME/bin/stack"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Log in to container image registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          stack prepare --stack ./stack \
            --publish-images --image-registry ghcr.io
