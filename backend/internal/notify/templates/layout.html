{{define "layout"}}<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Subject}}</title></head>
<body style="margin:0;padding:0;background:#f1f0ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#22201d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f0ed;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e0ddd7;">
  <tr><td style="background:#1c3f39;padding:20px 28px;">
    <div style="color:#ffffff;font-size:17px;font-weight:700;letter-spacing:-0.01em;">{{.CompanyName}}</div>
    <div style="color:#9dc4b8;font-size:12px;margin-top:2px;">Equipment &amp; Tool Hire</div>
  </td></tr>
  <tr><td style="padding:28px;">
    <h1 style="margin:0 0 14px;font-size:20px;line-height:1.3;font-weight:650;color:#22201d;">{{.Heading}}</h1>
    {{.Content}}
  </td></tr>
  <tr><td style="padding:18px 28px;background:#faf9f7;border-top:1px solid #e9e6e0;font-size:12px;color:#77726b;line-height:1.6;">
    Questions? Reply to this email or call the yard on (406) 555-0134.<br>
    {{.CompanyName}} · 1420 Gallatin Road · Bozeman, MT
  </td></tr>
</table>
</td></tr></table>
</body></html>{{end}}
